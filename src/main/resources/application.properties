spring.application.name=MusicTrackerApi

# Console web do H2 (tela em /h2-console pra ver as tabelas no navegador) foi
# removido do pom.xml: no Spring Boot 4 ele virou um modulo separado
# (spring-boot-h2console) que só existe a partir da versão 4.2.0-M2 (uma
# milestone/pré-lançamento). Não vale a pena puxar uma milestone só por isso.
# O banco H2 em si continua funcionando normalmente (é usado via JPA); só a
# telinha de inspeção visual fica indisponível. Se quiser reativar no futuro
# com uma versão estável do Spring Boot que já inclua esse módulo, é só
# adicionar a dependência de volta e descomentar a linha abaixo.
# spring.h2.console.enabled=true

# Tamanho de pagina global: no maximo 2 itens por pagina em qualquer listagem,
# mesmo que o cliente peca um "size" maior na URL.
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=10
